[workspace]
resolver = "2"
members = ["crates/boilersync-core", "crates/boilersync-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/montaguegabe/boilersync-rs"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
dirs = "6"
tempfile = "3"
minijinja = "3"
minijinja-contrib = { version = "3", features = ["pycompat"] }
regex = "1"
md-5 = "0.10"
clap = { version = "4", features = ["derive", "wrap_help"] }

[profile.release]
lto = "thin"
strip = true
